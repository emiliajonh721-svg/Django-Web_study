<header class="bg-blue-500 font-serif text-white relative">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 h-20 flex justify-between items-center">
        <a href="{% url 'Homepage' %}" class="flex items-center gap-3">
            <i class="fa-solid fa-graduation-cap text-2xl"></i>
            <h1 class="text-lg sm:text-xl font-bold tracking-wide">EN CLUB</h1>
        </a>
        <nav class="hidden lg:flex items-center gap-8">
            <a class="hover:text-gray-300 border-b-2 border-transparent hover:border-blue-900 py-1"
                href="{% url 'Homepage' %}">Home</a>
            <div class="relative group">
                <a href="EnCourse.html"
                    class="flex items-center gap-2 hover:text-gray-300 border-b-2 border-transparent hover:border-blue-900 py-1">
                    English Course
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </a>
                <div class="hidden group-hover:block absolute top-full left-0 pt-3 w-48 z-50">
                    <div class="bg-white text-black shadow-lg rounded-lg overflow-hidden">
                        <a href="{% url 'Allcourse' %}" class="block px-4 py-3 hover:bg-blue-100">All Courses</a>
                        <a href="{% url 'Beginers' %}" class="block px-4 py-3 hover:bg-blue-100">Beginner</a>
                        <a href="{% url 'Intermediate' %}" class="block px-4 py-3 hover:bg-blue-100">Intermediate</a>
                        <a href="{% url 'Advance' %}" class="block px-4 py-3 hover:bg-blue-100">Advanced</a>
                        <a href="{% url 'ElectronicBooks' %}" class="block px-4 py-3 hover:bg-blue-100">Electronic books</a>
                    </div>
                </div>
            </div>
            <a class="hover:text-gray-300 border-b-2 border-transparent hover:border-blue-900 py-1"
                href="{% url 'Contactus' %}">Contact</a>

            <a class="hover:text-gray-300 border-b-2 border-transparent hover:border-blue-900 py-1"
                href="{% url 'aboutus' %}">About us</a>
        </nav>
        <div class="hidden lg:flex items-center gap-6">
            <div class="relative flex items-center">
                <input type="search" placeholder="Search...."
                    class="bg-yellow-50 rounded text-black outline-none pl-3 pr-8 py-1 w-44 xl:w-56">
                <i class="fa-solid fa-magnifying-glass text-gray-500 absolute right-2.5 text-sm"></i>
            </div>
            <a class="hover:text-gray-300 border-b-2 border-transparent hover:border-blue-900"
                href="{% url 'loginform' %}">Login</a>

            <a class="hover:text-gray-300 border-b-2 border-transparent hover:border-blue-900"
                href="">Register</a>
        </div>
        <button id="mobile-menu-btn" type="button" aria-label="Toggle Menu"
            class="lg:hidden text-2xl p-2 rounded hover:bg-blue-600 focus:outline-none">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
    <div id="mobile-menu" class="hidden lg:hidden bg-blue-600 px-4 pt-3 pb-6 space-y-4 border-t border-blue-400">
        <div class="relative flex items-center">
            <input type="search" placeholder="Search...."
                class="w-full bg-yellow-50 rounded text-black outline-none pl-3 pr-9 py-2">
            <i class="fa-solid fa-magnifying-glass text-gray-500 absolute right-3"></i>
        </div>
        <div class="flex flex-col space-y-2">
            <a href="{% url 'Homepage' %}" class="py-2 px-3 rounded hover:bg-blue-500">Home</a>
            <div>
                <button id="mobile-course-btn" type="button"
                    class="w-full flex justify-between items-center py-2 px-3 rounded hover:bg-blue-500">
                    <span>English Course</span>
                    <i id="mobile-course-icon" class="fa-solid fa-chevron-down text-xs transition-transform"></i>
                </button>
                <div id="mobile-course-list" class="hidden pl-6 pr-2 py-1 space-y-1 bg-blue-700/50 rounded-lg mt-1">
                    <a href="{% url 'Allcourse' %}" class="block py-2 px-3 rounded hover:bg-blue-500 text-sm">All Courses</a>
                    <a href="{% url 'Beginers' %}" class="block py-2 px-3 rounded hover:bg-blue-500 text-sm">Beginner</a>
                    <a href="{% url 'Intermediate' %}" class="block py-2 px-3 rounded hover:bg-blue-500 text-sm">Intermediate</a>
                    <a href="{% url 'Advance' %}" class="block py-2 px-3 rounded hover:bg-blue-500 text-sm">Advanced</a>
                    <a href="{% url 'ElectronicBooks' %}" class="block py-2 px-3 rounded hover:bg-blue-500 text-sm">Electronic books</a>
                </div>
            </div>
            <a href="{% url 'Contactus' %}" class="py-2 px-3 rounded hover:bg-blue-500">Contact</a>
            <a href="{% url 'aboutus' %}" class="py-2 px-3 rounded hover:bg-blue-500">About us</a>
        </div>
        <div class="pt-3 border-t border-blue-400 flex gap-4">
            <a href="{% url 'loginform' %}"
                class="w-1/2 text-center py-2 rounded border border-white hover:bg-blue-500">Login</a>
            <a href=""
                class="w-1/2 text-center py-2 rounded bg-white text-blue-600 font-semibold hover:bg-gray-100">Register</a>
        </div>
    </div>
</header>
<script>
    const menuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const courseBtn = document.getElementById('mobile-course-btn');
    const courseList = document.getElementById('mobile-course-list');
    const courseIcon = document.getElementById('mobile-course-icon');

    menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
    });

    courseBtn.addEventListener('click', () => {
        courseList.classList.toggle('hidden');
        courseIcon.classList.toggle('rotate-180');
    });
</script>
