{% load static %}
<div class="mt-10 px-4 sm:px-8 lg:px-30 py-6 md:py-10">
    <h1 class="text-2xl md:text-[20pt] font-bold">Our Core Trainers & Leader</h1>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 px-4 sm:px-8 lg:mx-30">
    <div class="w-full max-w-sm mx-auto overflow-hidden bg-white rounded-lg shadow-lg pb-10">
        <div class="relative">
            <img class="w-full h-[380px] object-cover object-[50%_20%]" src="{% static 'images/ponleu.png' %}" alt="Dr. Bourn Ponleu">
        </div>
        <div class="px-6 py-4">
            <div class="text-xl font-semibold text-gray-800">Dr. Bourn Ponleu</div>
            <p class="text-gray-600">President</p>
        </div>
        <div class="px-6 flex flex-wrap gap-2">
            <span class="inline-block px-2 py-1 text-sm font-semibold text-blue-950 bg-gray-200 rounded-full">Leadership</span>
            <span class="inline-block px-2 py-1 text-sm font-semibold text-blue-950 bg-gray-200 rounded-full">Event planning</span>
        </div>
    </div>

    <!-- Card 2 -->
    <div class="w-full max-w-sm mx-auto overflow-hidden bg-white rounded-lg shadow-lg pb-10">
        <div class="relative">
            <img class="w-full h-[380px] object-cover object-[50%_20%]" src="{% static 'images/reaksa.png' %}" alt="Dr. Ray Reaksa">
        </div>
        <div class="px-6 py-4">
            <div class="text-xl font-semibold text-gray-800">Dr. Ray Reaksa</div>
            <p class="text-gray-600">Presentation/Speech</p>
        </div>
        <div class="px-6 flex flex-wrap gap-2">
            <span class="inline-block px-2 py-1 text-sm font-semibold text-blue-950 bg-gray-200 rounded-full">Pronunciation</span>
            <span class="inline-block px-2 py-1 text-sm font-semibold text-black bg-gray-200 rounded-full">Vocabulary</span>
        </div>
    </div>

    <!-- Card 3 -->
    <div class="w-full max-w-sm mx-auto overflow-hidden bg-white rounded-lg shadow-lg pb-10">
        <div class="relative">
            <img class="w-full h-[380px] object-cover object-[50%_20%]" src="{% static 'images/sambath.png' %}" alt="Dr. Sourn Sambath">
        </div>
        <div class="px-6 py-4">
            <div class="text-xl font-semibold text-gray-800">Dr. Sourn Sambath</div>
            <p class="text-gray-600">Grammar/Tour</p>
        </div>
        <div class="px-6 flex flex-wrap gap-2">
            <span class="inline-block px-2 py-1 text-sm font-semibold text-blue-950 bg-gray-200 rounded-full">Intermediate</span>
            <span class="inline-block px-2 py-1 text-sm font-semibold text-blue-950 bg-gray-200 rounded-full">Advance</span>
        </div>
    </div>

    <!-- Card 4 -->
    <div class="w-full max-w-sm mx-auto overflow-hidden bg-white rounded-lg shadow-lg pb-10">
        <div class="relative">
            <img class="w-full h-[380px] object-cover object-[50%_20%]" src="{% static 'images/heng.png' %}" alt="Dr. Hai Sokheng">
        </div>
        <div class="px-6 py-4">
            <div class="text-xl font-semibold text-gray-800">Dr. Hai Sokheng</div>
            <p class="text-gray-600">IELTS training</p>
        </div>
        <div class="px-6 flex flex-wrap gap-2">
            <span class="inline-block px-2 py-1 text-sm font-semibold text-blue-950 bg-gray-200 rounded-full">United States</span>
            <span class="inline-block px-2 py-1 text-sm font-semibold text-blue-950 bg-gray-200 rounded-full">United Kingdom</span>
        </div>
    </div>
</div>
